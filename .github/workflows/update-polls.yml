# Daily NESDC check (12:00 KST).
# 1. '전국단위 선거여론조사결과 주요 데이터' workbook (posted weekly): when it changed, rebuild the 조국혁신당/개혁신당
#    PR sensitivity and the dashboard data, run the checks, and redeploy Pages
#    (pushes made with GITHUB_TOKEN do not trigger other workflows).
# 2. 정부지원·견제 / 정권심판 frame questions in newly registered national polls: only a review list
#    (outputs/frame_candidates.json) and a GitHub issue. Registering a poll in data/frame_polls_multi.json stays manual
#    (UPDATE_PROTOCOL). A failure here does not block step 1.
#    The same scan collects 2028 party vote-intention questions into outputs/vote_intention_2028.csv (collect-only,
#    not a model input; no issue is opened for these).
name: Update NESDC party support

on:
  schedule:
    - cron: "0 3 * * *"   # 12:00 KST
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: update-polls
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pdfplumber==0.11.9
      - name: Fetch newest workbook
        id: fetch
        run: |
          set +e
          python scripts/fetch_nesdc_party_support.py
          code=$?
          set -e
          if [ "$code" = "3" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [ "$code" = "0" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"
          else exit "$code"; fi
      - name: Scan new registrations for frame questions
        id: frames
        continue-on-error: true
        run: |
          set +e
          python scripts/scan_nesdc_frame_candidates.py --summary "$RUNNER_TEMP/frame_summary.md"
          code=$?
          set -e
          if [ "$code" = "0" ]; then echo "found=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" != "3" ]; then exit "$code"; fi
      - name: Rebuild sensitivity and dashboard
        if: steps.fetch.outputs.changed == 'true'
        run: |
          python scripts/build_party_support.py
          python scripts/pr_seats.py
          python scripts/build_site.py
          python -m unittest test_jk_support -v
      - name: Commit
        id: commit
        run: |
          git add data/nesdc/nesdc_major_data_national.xlsx data/nesdc/nesdc_major_data_source.json data/nesdc/party_support_national.csv \
                  outputs/jk_support.json outputs/seats_300.json docs/data.js docs/index.html \
                  data/nesdc/frame_scan_state.json outputs/frame_candidates.json outputs/vote_intention_2028.csv
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          msg="자동 갱신: 여심위"
          if [ "${{ steps.fetch.outputs.changed }}" = "true" ]; then
            msg="$msg $(python -c "import json;print(json.load(open('data/nesdc/nesdc_major_data_source.json',encoding='utf-8'))['post_title'])")"
          else
            msg="$msg 등록 조사 스캔"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$msg"
          git push
      - name: Deploy Pages
        if: steps.fetch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run static.yml --ref main
      - name: Open review issue for frame candidates
        if: steps.frames.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "정부지원·견제 문항 후보 검토 ($(TZ=Asia/Seoul date +%F))" --body-file "$RUNNER_TEMP/frame_summary.md"
